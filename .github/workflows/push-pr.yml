name: push-pr
on:
  push:
    branches:
      - main
    path:
      - "src/**"
  pull_request:
    branches:
      - main
    path:
      - "src/**"
      
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
      - name: run tests
        run: npm run test
